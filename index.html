<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stark Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #020617;
            color: #ffffff;
            font-family: monospace;
            min-height: 100vh;
            overflow: hidden;
        }
        .flex-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 1. INITIAL BOOT SCREEN */
        #boot-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            background-color: #020617;
            text-align: center;
        }
        #init-btn {
            padding: 16px 32px;
            background-color: #06b6d4;
            color: #020617;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 0.1em;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
            transition: transform 0.2s ease;
        }
        #init-btn:hover {
            transform: scale(1.05);
        }

        /* 2. GAUNTLET LAYER */
        #animation-screen {
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 20px;
        }
        #repulsor-hand {
            width: 260px;
            height: 380px;
            position: relative;
            transform: translateY(100%);
            opacity: 0;
        }
        
        #repulsor-node {
            position: absolute;
            top: 23%;
            left: 50%;
            transform: translateX(-50%) translateY(-50%);
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 20px #fff, 0 0 40px #22d3ee, 0 0 80px #06b6d4, 0 0 120px #06b6d4;
            z-index: 10;
        }

        /* 3. MODERATED NEON ENERGY FLARE LAYER (FIXED ACCORDING TO YOUR ROADMAP) */
        #flash-screen {
            position: fixed;
            inset: 0;
            z-index: 41;
            background-color: #06b6d4; /* Changed from white to Stark Cyan Energy Blue */
            pointer-events: none;
            opacity: 0;
        }

        /* 4. ACTUAL MAIN PORTFOLIO VIEW */
        #portfolio-landing {
            max-width: 800px;
            margin: 100px auto 0 auto;
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 40px;
            border-radius: 8px;
            background-color: #0f172a;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.1);
            text-align: center;
        }

        /* ==========================================
           ANIMATION TIMELINES
           ========================================== */
        .run-hand {
            animation: handTimeline 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .run-node {
            animation: nodeTimeline 0.7s 0.5s ease-in forwards;
        }
        /* Sped up the flash to fade out much faster and capped max intensity to 0.7 opacity */
        .run-flash {
            animation: flashTimeline 0.6s 1.2s ease-out forwards;
        }

        @keyframes handTimeline {
            0% { transform: translateY(100%); opacity: 0; }
            25% { transform: translateY(0); opacity: 1; }  
            80% { transform: translateY(0); opacity: 1; }  
            100% { transform: translateY(120%); opacity: 0; } 
        }

        @keyframes nodeTimeline {
            0% { width: 8px; height: 8px; }
            100% { width: 85px; height: 85px; } 
        }

        @keyframes flashTimeline {
            0% { opacity: 0; }
            20% { opacity: 0.7; } /* Capped so it doesn't blindingly wash out the entire screen */
            100% { opacity: 0; }  /* Snappy fade out to background slate */
        }
    </style>
</head>
<body>

    <!-- 1. INITIAL BOOT SCREEN -->
    <div id="boot-screen" class="flex-center">
        <h2 style="color: #22d3ee; margin-bottom: 8px; letter-spacing: 0.2em;">JARVIS SYSTEM V4</h2>
        <p style="color: #64748b; font-size: 12px; margin-bottom: 32px;">ONLINE PROTOCOLS STANDING BY</p>
        <button id="init-btn">INITIALIZE SYSTEMS</button>
    </div>

    <!-- 2. THE ANIMATION SCREEN OVERLAY -->
    <div id="animation-screen">
        <div id="repulsor-hand">
            <div id="repulsor-node"></div>
            
            <svg viewBox="0 0 100 150" style="width: 100%; height: 100%;">
                <path d="M 22 150 L 78 150 L 74 100 L 26 100 Z" fill="#7f1d1d" />
                <path d="M 26 100 L 74 100 L 70 55 L 30 55 Z" fill="#b91c1c" />
                <path d="M 26 100 L 34 100 L 36 65 L 30 55 Z" fill="#eab308" />
                <path d="M 74 100 L 66 100 L 64 65 L 70 55 Z" fill="#eab308" />
                <path d="M 38 100 L 62 100 L 58 85 L 42 85 Z" fill="#eab308" opacity="0.85" />
                <path d="M 30 55 L 70 55 L 75 32 L 25 32 Z" fill="#991b1b" />
                <path d="M 25 32 L 18 20 L 23 16 L 29 26 Z" fill="#b91c1c" />
                <path d="M 32 20 L 32 2 L 39 2 L 39 20 Z" fill="#7f1d1d" />
                <path d="M 32 14 L 32 2 L 39 2 L 39 14 Z" fill="#eab308" />
                <path d="M 43 20 L 43 0 L 51 0 L 51 20 Z" fill="#b91c1c" />
                <path d="M 43 12 L 43 0 L 51 0 L 51 12 Z" fill="#eab308" />
                <path d="M 55 20 L 55 4 L 62 4 L 62 20 Z" fill="#7f1d1d" />
                <path d="M 55 14 L 55 4 L 62 4 L 62 14 Z" fill="#eab308" />
                <path d="M 66 24 L 66 10 L 72 10 L 72 24 Z" fill="#b91c1c" />
                <path d="M 28 35 L 72 35 L 66 18 L 34 18 Z" fill="#dc2626" />
                <circle cx="50" cy="35" r="16" fill="#1e293b" stroke="#eab308" stroke-width="1.5" />
                <circle cx="50" cy="35" r="11" fill="#0891b2" />
                <circle cx="50" cy="35" r="8" fill="#e0f7fa" />
            </svg>
        </div>
    </div>

    <!-- 3. FLASH IMPACT LAYER -->
    <div id="flash-screen"></div>

    <!-- 4. CORE PORTFOLIO APPLICATION CONTAINER -->
    <div id="portfolio-landing" style="display: none;">
        <h1 style="color: #22d3ee; margin-bottom: 16px; font-size: 28px;">STARK_SE // ARCHITECTURE LOADED</h1>
        <p style="color: #94a3b8; line-height: 1.6; margin-bottom: 24px;">
            I am a Software Engineer specializing in deploying optimized, cutting-edge software configurations.
        </p>
        <span style="color: #06b6d4; font-size: 12px; display: block;">[ System fully operational. Scroll unlocked. ]</span>
    </div>

    <!-- 5. ISOLATED EVENT CONTROLLER LOGIC -->
    <script>
        const initBtn = document.getElementById('init-btn');

        function triggerAudioCue(filename, volumeLevel) {
            try {
                const soundEffect = new Audio('sounds/' + filename);
                soundEffect.volume = volumeLevel;
                soundEffect.play().catch(() => {
                    console.log(`Audio system notice: "${filename}" skipped or pathway unmapped.`);
                });
            } catch (err) {
                console.log("Native hardware browser sound matrix currently restricted.");
            }
        }

        initBtn.addEventListener('click', () => {
            document.getElementById('boot-screen').style.display = 'none';
            
            document.getElementById('repulsor-hand').classList.add('run-hand');
            document.getElementById('repulsor-node').classList.add('run-node');
            document.getElementById('flash-screen').classList.add('run-flash');
            
            triggerAudioCue('charge.mp3', 0.4);
            setTimeout(() => { 
                triggerAudioCue('blast.mp3', 0.5); 
            }, 1100);

            // Keeps loading smooth and hidden behind the dialed-down laser flash
            setTimeout(() => {
                document.getElementById('portfolio-landing').style.display = 'block';
                document.body.style.overflow = 'auto'; 
            }, 1300);
        });
    </script>
</body>
</html>
